name: Run Unit Tests

on:
  push:
    branches: [ "rectangle" ]  

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'  

    - name: Install dependencies
      run: |
        pip install -r requirements.txt  # если есть requirements.txt
        # если у тебя poetry, pipenv и т.п. — замени эту строку

    - name: Run unit tests
      run: |
        python -m unittest discover -v  # стандартный способ для unittest
        # если у тебя pytest: pytest -v
        # если у тебя другой фреймворк — напиши, я подскажу команду